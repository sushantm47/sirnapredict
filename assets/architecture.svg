<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .stage { letter-spacing: .08em; }
      @media (prefers-color-scheme: dark) {
        .box { fill: #0d1117; stroke: #30363d; }
        .tint { fill: #161b22; stroke: #30363d; }
        .title { fill: #e6edf3; }
        .sub, .mono, .stage { fill: #8b949e; }
        .flow { stroke: #6e7681; }
        .accent { fill: #58a6ff; }
      }
    </style>
  </defs>

  <rect class="tint" x="20" y="44" width="190" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="tint" x="250" y="44" width="190" height="130" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="box" x="480" y="44" width="190" height="130" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="box" x="710" y="44" width="170" height="130" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="tint" x="250" y="210" width="190" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="tint" x="480" y="210" width="400" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <rect class="box" x="20" y="320" width="860" height="92" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <text class="stage" x="20" y="28" font-size="11" font-weight="700" fill="#8b949e">DATA</text>
  <text class="stage" x="250" y="28" font-size="11" font-weight="700" fill="#8b949e">TRAINING</text>
  <text class="stage" x="480" y="28" font-size="11" font-weight="700" fill="#8b949e">SERVING</text>
  <text class="stage" x="715" y="28" font-size="11" font-weight="700" fill="#8b949e">INTERFACE</text>
  <text class="title" x="36" y="70" font-size="15" font-weight="600" fill="#1f2328">Published assay</text>
  <text class="sub" x="36" y="92" font-size="12" font-weight="400" fill="#57606a">2,361 measured siRNAs</text>
  <text class="sub" x="36" y="110" font-size="12" font-weight="400" fill="#57606a">Huesken et al. 2005</text>
  <text class="mono" x="36" y="136" font-size="11.5" font-weight="400" fill="#57606a">scripts/prepare_data</text>
  <text class="sub" x="36" y="156" font-size="12" font-weight="400" fill="#57606a">detects columns, rebuilds</text>
  <text class="sub" x="36" y="170" font-size="12" font-weight="400" fill="#57606a">89 target transcripts</text>
  <text class="title" x="266" y="70" font-size="15" font-weight="600" fill="#1f2328">Model</text>
  <text class="mono" x="266" y="94" font-size="11.5" font-weight="400" fill="#57606a">src/features.py</text>
  <text class="sub" x="266" y="112" font-size="12" font-weight="400" fill="#57606a">102 features: position,</text>
  <text class="sub" x="266" y="126" font-size="12" font-weight="400" fill="#57606a">thermodynamics, rules</text>
  <text class="mono" x="266" y="150" font-size="11.5" font-weight="400" fill="#57606a">src/train.py</text>
  <text class="sub" x="266" y="168" font-size="12" font-weight="400" fill="#57606a">GroupKFold by transcript</text>
  <text class="title" x="496" y="70" font-size="15" font-weight="600" fill="#1f2328">FastAPI</text>
  <text class="mono" x="496" y="94" font-size="11.5" font-weight="400" fill="#57606a">POST /predict</text>
  <text class="mono" x="496" y="112" font-size="11.5" font-weight="400" fill="#57606a">POST /predict/batch</text>
  <text class="mono" x="496" y="130" font-size="11.5" font-weight="400" fill="#57606a">POST /design</text>
  <text class="mono" x="496" y="148" font-size="11.5" font-weight="400" fill="#57606a">GET  /model/info</text>
  <text class="sub" x="496" y="168" font-size="12" font-weight="400" fill="#57606a">localhost:8000</text>
  <text class="title" x="726" y="70" font-size="15" font-weight="600" fill="#1f2328">Streamlit</text>
  <text class="sub" x="726" y="94" font-size="12" font-weight="400" fill="#57606a">Design</text>
  <text class="sub" x="726" y="112" font-size="12" font-weight="400" fill="#57606a">Check siRNA</text>
  <text class="sub" x="726" y="130" font-size="12" font-weight="400" fill="#57606a">Assay Data</text>
  <text class="sub" x="726" y="148" font-size="12" font-weight="400" fill="#57606a">Model Info</text>
  <text class="sub" x="726" y="168" font-size="12" font-weight="400" fill="#57606a">localhost:8501</text>
  <text class="mono" x="266" y="256" font-size="11.5" font-weight="400" fill="#57606a">model/sirna_model.pkl</text>
  <text class="mono" x="266" y="276" font-size="11.5" font-weight="400" fill="#57606a">model/metrics.json</text>
  <text class="sub" x="496" y="258" font-size="12" font-weight="400" fill="#57606a">Folds are split by target transcript, never at random,</text>
  <text class="sub" x="496" y="276" font-size="12" font-weight="400" fill="#57606a">so the model is only ever scored on unseen genes.</text>
  <text class="sub" x="44" y="372" font-size="12" font-weight="400" fill="#57606a">1 · paste a gene’s mRNA sequence</text>
  <text class="sub" x="262" y="372" font-size="12" font-weight="400" fill="#57606a">2 · every 19-mer is scored</text>
  <text class="sub" x="482" y="372" font-size="12" font-weight="400" fill="#57606a">3 · ranked by predicted knockdown</text>
  <text class="sub" x="44" y="396" font-size="12" font-weight="400" fill="#57606a">Filters (GC range, base runs) are applied before ranking; results download as CSV.</text>
  <text class="title" x="266" y="234" font-size="13" font-weight="600" fill="#1f2328">Artefacts</text>
  <text class="title" x="496" y="234" font-size="13" font-weight="600" fill="#1f2328">Why the scores are trustworthy</text>
  <text class="title" x="40" y="346" font-size="15" font-weight="600" fill="#1f2328">What a user does</text>

  <path class="flow" d="M 210 109 L 244 109" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path class="flow" d="M 440 109 L 474 109" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path class="flow" d="M 704 102 L 672 102" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path class="flow" d="M 672 122 L 704 122" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path class="flow" d="M 345 174 L 345 204" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path class="flow" d="M 440 249 L 540 249 L 540 180" fill="none" stroke="#8b949e" stroke-width="1.8" marker-end="url(#arrow)"/>
  <circle class="accent" cx="34" cy="368" r="3" fill="#0969da"/>
  <circle class="accent" cx="252" cy="368" r="3" fill="#0969da"/>
  <circle class="accent" cx="472" cy="368" r="3" fill="#0969da"/>
</svg>
